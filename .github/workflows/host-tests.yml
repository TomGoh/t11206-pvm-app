# Runs the terminal model's host test on every push and pull request. The app itself builds only
# in an Android tree (platform certificate, the service's AIDL library), so that is not run here.
name: host-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  terminal-buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: host-tests/run.sh
